server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------------
    # Proxy all /api/* requests to the backend container.
    # The /api/ prefix is stripped before forwarding.
    # e.g. /api/auth/google  →  http://backend:8000/auth/google
    # ----------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support large image uploads
        client_max_body_size 150M;
        proxy_request_buffering off;

        # Long timeouts for AI processing (up to 15 min)
        proxy_read_timeout  900s;
        proxy_send_timeout  900s;
        proxy_connect_timeout 10s;
    }

    # ----------------------------------------------------------------
    # SPA catch-all — serve index.html for all non-asset routes
    # so React Router works on hard refresh / direct links
    # ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
}
